name: Release Project

on:
  issue_comment:
    types: [ created, deleted ]
  push:
    branches:
      - master
      - test
  workflow_dispatch:
    inputs:
      snapshot:
        description: Snapshot publish tag.
        type: string

jobs:
  check:
    if: inputs.snapshot == ''
    name: Context check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      continue: ${{ steps.checkkk.outputs.continue }}
      workflow: ${{ steps.checkkk.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      
      - name: Context check
        id: checkkk
        uses: ./
        with:
          workflow: check
          github-token: ${{ secrets.GITHUB_TOKEN }}
  
  pull-request:
    needs: check
    if: needs.check.outputs.workflow == 'pull-request'
    name: Pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      
      - name: Create or update pull request
        uses: ./
        with:
          workflow: pull-request
          github-token: ${{ secrets.GITHUB_TOKEN }}
  
  release:
    needs: check
    if: needs.check.outputs.workflow == 'release'
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      
      - name: Install deps
        run: pnpm install --frozen-lockfile
      
      - name: Release
        uses: ./
        with:
          workflow: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
  
  snapshot:
    if: inputs.snapshot != ''
    name: Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      
      - name: Install deps
        run: pnpm install --frozen-lockfile
      
      - name: Publish
        uses: ./
        with:
          workflow: snapshot
          github-token: ${{ secrets.GITHUB_TOKEN }}
          bump-snapshot: ${{ inputs.snapshot }}
